{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "hello-world.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.className }}
  gatewayClassName: {{ . }}
  {{- with .Values.gateway.infrastructure.annotations }}
  infrastructure:
    annotations:
      {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- with .Values.gateway.addresses }}
  addresses:
    {{- toYaml . | nindent 4}}
  {{- end }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hello-world.fullname" . }}-route
  namespace: {{  .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ include "hello-world.fullname" .}}
      namespace: {{ .Release.Namespace }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4}}
  {{- end}}
  {{- with .Values.httpRoute.rules }}
  rules:
  {{- toYaml . | nindent 4}}
  {{- end }}
---
{{- end }}
{{- end }}
