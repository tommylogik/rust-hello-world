replicaCount: 1

image:
  repository: ghcr.io/tommylogik/rust-hello-world
  pullPolicy: Always
  tag: {{.Chart.AppVersion }}

imagePullSecrets: []

nameOverride: ""

fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automount: true
  annotations: {}

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP

  port: 80
  containerPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}

  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

gateway:
  enabled: false
  className: nginx
  infrastructure:
    annotations: []
  addresses: []

httpRoute:

  enabled: false

  annotations: {}

  parentRefs:
    - name: gateway
      sectionName: http

  hostnames:
    - chart-example.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
